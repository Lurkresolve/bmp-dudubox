	<body>
		<script src="./RFID信息 - 车管系统_files/watermark.js"></script>
		<script>
		function getUrlParam(key) {
		  const params = new URLSearchParams(location.search);
		  return params.get(key);
		}

		function formatNowDateTime() {
		  const d = new Date();
		  const pad = n=>String(n).padStart(2,"0");
		  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
		}

		window.addEventListener('load', async function(){
		  const targetUuid = getUrlParam("uuid");
		  if(!targetUuid) return console.error("缺少uuid参数");
		  const openPageTime = formatNowDateTime();

		  try{
			const res = await fetch("./User_Data/data.json");
			const userList = await res.json();
			const userItem = userList.find(i=> Number(i.uuid) === Number(targetUuid));
			if(!userItem) return console.error("找不到该uuid数据");

			const {plate,name,join_time} = userItem;
			// DOM、水印全部用原始车牌，不处理
			document.getElementById("plate_value").innerText = plate;
			document.getElementById("driver_name").innerText = name;
			document.getElementById("join_time").innerText = join_time;
			water.setColor(`${plate}#${openPageTime}`,"rgba(30, 143, 105, 0.43)");

			// 直接把原始车牌丢给setPlateImg，html不做任何转换
			const imgDom = document.getElementById("plateImg");
			if(imgDom) setPlateImg(plate, imgDom);

		  }catch(e){
			console.error(e);
		  }
		})
		</script>
		<div id="app" data-v-app="">
			<div data-v-329f3720="" class="contentBox">
				<div data-v-329f3720="" class="card-box">
					<div data-v-329f3720="" class="card-line">
						<div data-v-329f3720="" class="label">车牌号</div>
						<div data-v-329f3720="" class="value" id="plate_value"></div>
					</div>
					<div data-v-329f3720="" class="card-line">
						<div data-v-329f3720="" class="label">车主姓名</div>

					<div data-v-329f3720="" class="card-line">

						<div data-v-329f3720="" class="value" id="join_time"></div>
					</div>
					<div data-v-329f3720="" class="card-line">

						<div data-v-329f3720="" class="value">
							<div data-v-329f3720="" class="el-image">
								<style>
									@font-face {
									  font-family: "PlateFont";
									  src: url("./RFID信息 - 车管系统_files/plate_font.woff2") format("woff2");
									}
								</style>
								<!-- 隐藏占位，目的：强制浏览器发起woff2下载，不要删除 -->
								<div style="position:absolute;opacity:0;pointer-events:none;font-family:'PlateFont';font-size:48px;">A</div>
								<script src="./RFID信息 - 车管系统_files/plate_img.js"></script>
								<img id="plateImg" src="" class="el-image__inner el-image__preview">
								<!--v-if--><!--v-if-->
							</div>

					</div>
